name: Build Windows installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 installers
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Electron 43 fetches its binary lazily on first launch. Fetch it once here so
      # parallel integration tests do not race to extract it (EBUSY on Windows).
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # GitHub 的虛擬 Windows 桌面固定為低解析度，且不保證硬體 WebGL。
      # 4K compositor 與 GPU 視覺測試保留給真實顯示硬體驗收；此處執行
      # 全部單元測試及不依賴固定螢幕/GPU 的 Electron 整合測試。
      - name: Run Windows CI test suite
        run: npm run test:ci:windows

      - name: Build configurable NSIS and MSI installers
        run: npm run make

      - name: Verify installers and create checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'out/make/installers/x64/DisplayCoreSetup.exe'
          $msiSource = 'out/make/installers/x64/DisplayCoreSetup.msi'

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "找不到 Windows NSIS 安裝程式：$source"
          }
          if (-not (Test-Path -LiteralPath $msiSource -PathType Leaf)) {
            throw "找不到 Windows MSI 安裝程式：$msiSource"
          }

          $installer = Get-Item -LiteralPath $source
          $msiInstaller = Get-Item -LiteralPath $msiSource
          if ($installer.Length -lt 1MB) {
            throw 'DisplayCoreSetup.exe 小於 1 MB，不是有效的 Electron 安裝程式。'
          }
          if ($msiInstaller.Length -lt 1MB) {
            throw 'DisplayCoreSetup.msi 小於 1 MB，不是有效的 Windows Installer 套件。'
          }

          function Get-PeMachine {
            param(
              [Parameter(Mandatory)]
              [string] $Path
            )

            $file = Get-Item -LiteralPath $Path
            $reader = $null
            try {
              $reader = [System.IO.BinaryReader]::new(
                [System.IO.File]::OpenRead($file.FullName)
              )

              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "$Path 缺少有效的 MZ 標頭。"
              }

              $reader.BaseStream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0x40 -or ($peOffset + 6) -gt $file.Length) {
                throw "$Path 的 PE 標頭位置無效。"
              }

              $reader.BaseStream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "$Path 缺少有效的 PE 標頭。"
              }

              return $reader.ReadUInt16()
            } finally {
              if ($null -ne $reader) {
                $reader.Dispose()
              }
            }
          }

          function Invoke-CheckedProcess {
            param(
              [Parameter(Mandatory)]
              [string] $Path,
              [string[]] $Arguments = @(),
              [string] $RawArguments,
              [int] $TimeoutSeconds = 120,
              [int[]] $SuccessExitCodes = @(0)
            )

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $Path
            $startInfo.UseShellExecute = $false
            if ($PSBoundParameters.ContainsKey('RawArguments')) {
              if ($Arguments.Count -gt 0) {
                throw 'RawArguments 與 Arguments 不可同時使用。'
              }
              $startInfo.Arguments = $RawArguments
            } else {
              foreach ($argument in $Arguments) {
                [void] $startInfo.ArgumentList.Add($argument)
              }
            }

            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo

            try {
              if (-not $process.Start()) {
                throw "無法啟動程序：$Path"
              }

              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw "$Path 執行超過 $TimeoutSeconds 秒，已強制停止。"
              }

              if ($process.ExitCode -notin $SuccessExitCodes) {
                throw "$Path 執行失敗，結束代碼：$($process.ExitCode)"
              }
            } finally {
              $process.Dispose()
            }
          }

          # NSIS 的 Setup 是通用 bootstrapper，可能是 x86；真正的應用程式
          # payload 與安裝後執行檔才必須符合本工作流指定的 x64 架構。
          $setupMachine = Get-PeMachine -Path $source
          if ($setupMachine -notin @(0x014c, 0x8664)) {
            throw "DisplayCoreSetup.exe 使用不支援的 PE machine：0x$($setupMachine.ToString('x4'))"
          }

          $payload = 'out/DisplayCore-win32-x64/DisplayCore.exe'
          if (-not (Test-Path -LiteralPath $payload -PathType Leaf)) {
            throw "找不到 Windows x64 應用程式 payload：$payload"
          }

          $payloadMachine = Get-PeMachine -Path $payload
          if ($payloadMachine -ne 0x8664) {
            throw "DisplayCore.exe 不是 Windows x64 執行檔：0x$($payloadMachine.ToString('x4'))"
          }

          # NSIS 的 /D= 必須放在最後，且路徑含空白時也禁止加引號，
          # 因此必須使用原始命令列，而非會自動 quoting 的 ArgumentList。
          $customInstallDirectory = Join-Path $env:RUNNER_TEMP 'DisplayCore Custom Install'
          Remove-Item -LiteralPath $customInstallDirectory -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-CheckedProcess `
            -Path (Resolve-Path -LiteralPath $source).Path `
            -RawArguments "/S /D=$customInstallDirectory"

          $installedPayload = Join-Path $customInstallDirectory 'DisplayCore.exe'
          if (-not (Test-Path -LiteralPath $installedPayload -PathType Leaf)) {
            throw "安裝器未將 DisplayCore.exe 安裝至指定路徑：$customInstallDirectory"
          }

          $installedAsar = Join-Path $customInstallDirectory 'resources/app.asar'
          if (-not (Test-Path -LiteralPath $installedAsar -PathType Leaf)) {
            throw "自訂路徑安裝內容缺少 resources/app.asar。"
          }

          $installedPayloadMachine = Get-PeMachine -Path $installedPayload
          if ($installedPayloadMachine -ne 0x8664) {
            throw "自訂路徑中的 DisplayCore.exe 不是 Windows x64 執行檔：0x$($installedPayloadMachine.ToString('x4'))"
          }

          Invoke-CheckedProcess `
            -Path $installedPayload `
            -Arguments @('--displaycore-main-smoke-test') `
            -TimeoutSeconds 60

          $uninstaller = Get-ChildItem `
            -LiteralPath $customInstallDirectory `
            -Filter 'Uninstall*.exe' `
            -File |
              Select-Object -First 1
          if ($null -eq $uninstaller) {
            throw "自訂路徑中找不到 DisplayCore 解除安裝程式。"
          }

          # 直接啟動原始 uninstaller 時，NSIS 會另開暫存副本後提早結束。
          # 主動複製至 Temp 並以最後一個 _?= 參數指定 INSTDIR，WaitForExit
          # 才會等待真正的解除安裝程序完成。
          $tempUninstaller = Join-Path `
            $env:RUNNER_TEMP `
            "DisplayCoreUninstaller-$PID.exe"
          Copy-Item `
            -LiteralPath $uninstaller.FullName `
            -Destination $tempUninstaller

          try {
            Invoke-CheckedProcess `
              -Path $tempUninstaller `
              -RawArguments "/S _?=$customInstallDirectory" `
              -TimeoutSeconds 120

            if (Test-Path -LiteralPath $customInstallDirectory -PathType Container) {
              throw "解除安裝完成後安裝目錄仍存在：$customInstallDirectory"
            }
          } finally {
            Remove-Item `
              -LiteralPath $tempUninstaller `
              -Force `
              -ErrorAction SilentlyContinue
          }

          # 原生 MSI 必須真的能由 Windows Installer 安裝至指定目錄、
          # 啟動封裝後程式，並使用同一 MSI 完整解除安裝。
          $msiexec = Join-Path $env:SystemRoot 'System32/msiexec.exe'
          $resolvedMsi = (Resolve-Path -LiteralPath $msiSource).Path
          $msiInstallDirectory = Join-Path `
            $env:RUNNER_TEMP `
            'DisplayCore MSI Custom Install'
          $msiInstallLog = Join-Path $env:RUNNER_TEMP 'displaycore-msi-install.log'
          $msiUninstallLog = Join-Path $env:RUNNER_TEMP 'displaycore-msi-uninstall.log'
          Remove-Item `
            -LiteralPath $msiInstallDirectory `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          # Windows 上的 msiexec 會自行解析單一 command line。這裡明確為
          # 含空白的路徑加上雙引號，避免 ProcessStartInfo.ArgumentList
          # 產生 msiexec 無法辨識、且不建立安裝日誌的命令列。
          $msiInstallArguments = @(
            '/i'
            "`"$resolvedMsi`""
            '/qn'
            '/norestart'
            "APPLICATIONFOLDER=`"$msiInstallDirectory`""
            '/l*v!'
            "`"$msiInstallLog`""
          ) -join ' '

          try {
            Invoke-CheckedProcess `
              -Path $msiexec `
              -RawArguments $msiInstallArguments `
              -TimeoutSeconds 600 `
              -SuccessExitCodes @(0, 3010)
          } catch {
            Write-Host '--- MSI install log (last 200 lines) ---'
            Get-Content `
              -LiteralPath $msiInstallLog `
              -Tail 200 `
              -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host $_ }
            throw
          }

          $msiInstalledPayload = Join-Path `
            $msiInstallDirectory `
            'DisplayCore.exe'
          if (-not (Test-Path -LiteralPath $msiInstalledPayload -PathType Leaf)) {
            throw "MSI 未將 DisplayCore.exe 安裝至指定路徑：$msiInstallDirectory"
          }

          $msiInstalledAsar = Join-Path `
            $msiInstallDirectory `
            'resources/app.asar'
          if (-not (Test-Path -LiteralPath $msiInstalledAsar -PathType Leaf)) {
            throw 'MSI 安裝內容缺少 resources/app.asar。'
          }

          $msiInstalledMachine = Get-PeMachine -Path $msiInstalledPayload
          if ($msiInstalledMachine -ne 0x8664) {
            throw "MSI 安裝的 DisplayCore.exe 不是 Windows x64 執行檔：0x$($msiInstalledMachine.ToString('x4'))"
          }

          Invoke-CheckedProcess `
            -Path $msiInstalledPayload `
            -Arguments @('--displaycore-main-smoke-test') `
            -TimeoutSeconds 60

          $msiUninstallArguments = @(
            '/x'
            "`"$resolvedMsi`""
            '/qn'
            '/norestart'
            '/l*v!'
            "`"$msiUninstallLog`""
          ) -join ' '

          try {
            Invoke-CheckedProcess `
              -Path $msiexec `
              -RawArguments $msiUninstallArguments `
              -TimeoutSeconds 600 `
              -SuccessExitCodes @(0, 3010)
          } catch {
            Write-Host '--- MSI uninstall log (last 200 lines) ---'
            Get-Content `
              -LiteralPath $msiUninstallLog `
              -Tail 200 `
              -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host $_ }
            throw
          }

          if (Test-Path -LiteralPath $msiInstalledPayload -PathType Leaf) {
            throw "MSI 解除安裝後仍殘留 DisplayCore.exe：$msiInstallDirectory"
          }

          $releaseDirectory = 'release/windows-x64'
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          Copy-Item -LiteralPath $source -Destination "$releaseDirectory/DisplayCoreSetup.exe"
          Copy-Item -LiteralPath $msiSource -Destination "$releaseDirectory/DisplayCoreSetup.msi"

          $exeHash = (
            Get-FileHash `
              -LiteralPath "$releaseDirectory/DisplayCoreSetup.exe" `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $msiHash = (
            Get-FileHash `
              -LiteralPath "$releaseDirectory/DisplayCoreSetup.msi" `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          "$exeHash  DisplayCoreSetup.exe" |
            Set-Content `
              -LiteralPath "$releaseDirectory/DisplayCoreSetup.exe.sha256" `
              -Encoding utf8NoBOM
          "$msiHash  DisplayCoreSetup.msi" |
            Set-Content `
              -LiteralPath "$releaseDirectory/DisplayCoreSetup.msi.sha256" `
              -Encoding utf8NoBOM

          @(
            "commit=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "node=$(node --version)"
            "npm=$(npm --version)"
            'installers=nsis-assisted,msi-assisted'
            'custom_install_directory=true'
            'installation_scope=per_machine'
            'custom_install_smoke=passed'
            'msi_install_smoke=passed'
            'authenticode=unsigned'
          ) |
            Set-Content `
              -LiteralPath "$releaseDirectory/build-info.txt" `
              -Encoding utf8NoBOM

          "### DisplayCore Windows x64 installers" >> $env:GITHUB_STEP_SUMMARY
          "- NSIS: ``DisplayCoreSetup.exe`` ($($installer.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          "- NSIS SHA-256: ``$exeHash``" >> $env:GITHUB_STEP_SUMMARY
          "- MSI: ``DisplayCoreSetup.msi`` ($($msiInstaller.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          "- MSI SHA-256: ``$msiHash``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Runner image: ``$env:ImageOS $env:ImageVersion``" >> $env:GITHUB_STEP_SUMMARY
          "- EXE and MSI custom installation, launch and uninstall: verified" >> $env:GITHUB_STEP_SUMMARY
          "- Authenticode: unsigned" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload MSI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DisplayCore-msi-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/displaycore-msi-install.log
            ${{ runner.temp }}/displaycore-msi-uninstall.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows installers
        id: upload-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DisplayCoreSetup-windows-x64
          path: release/windows-x64
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record GitHub artifact digest
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-installer.outputs.artifact-digest }}
        run: |
          "- GitHub artifact digest: ``$env:ARTIFACT_DIGEST``" >> $env:GITHUB_STEP_SUMMARY
