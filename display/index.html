<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DisplayCore 顯示畫面</title>
    <link rel="stylesheet" href="./display.css">
  </head>
  <body>
    <div id="display-render-surface" class="display-render-surface">
      <main
        id="display-stage"
        class="display-stage"
        data-mode="blank"
        aria-label="DisplayCore 顯示視窗"
      >
      <p
        id="display-announcement"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
      <section
        id="normal-layer"
        class="normal-layer"
        aria-hidden="true"
        hidden
      >
        <div
          id="standby-background-layer"
          class="standby-background-layer"
          aria-hidden="true"
          hidden
        >
          <img
            id="standby-background-image"
            class="standby-background-image"
            alt=""
            aria-hidden="true"
            hidden
          >
          <img
            id="standby-background-image-buffer"
            class="standby-background-image"
            alt=""
            aria-hidden="true"
            hidden
          >
          <canvas
            id="standby-sand-transition"
            class="standby-sand-transition"
            aria-hidden="true"
            hidden
          ></canvas>
        </div>
        <header
          id="display-chrome"
          class="display-chrome"
          aria-hidden="true"
          hidden
        >
          <div id="logo-frame" class="logo-frame" hidden>
            <img
              id="display-logo"
              class="display-logo"
              alt=""
              aria-hidden="true"
              hidden
            >
          </div>
          <time
            id="display-clock"
            class="display-clock"
            aria-hidden="true"
            hidden
          ></time>
        </header>
        <section
          id="page-layer"
          class="page-layer"
          aria-hidden="true"
          hidden
        ></section>
      </section>
      <section
        id="fill-layer"
        class="fill-layer"
        aria-hidden="true"
        hidden
      ></section>
      </main>
    </div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
