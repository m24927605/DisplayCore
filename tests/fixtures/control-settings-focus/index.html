<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <title>DisplayCore 設定焦點回歸測試</title>
  </head>
  <body>
    <button
      id="open-settings-button"
      type="button"
      aria-label="開啟系統設定"
      disabled
    >設定</button>
    <input id="next-action-input" type="text">

    <dialog id="settings-dialog">
      <form id="settings-form">
        <output id="settings-dirty-status"></output>
        <p id="settings-notice" hidden></p>
        <p id="settings-error" hidden></p>
        <p id="settings-status"></p>

        <div class="settings-dialog-body">
          <fieldset id="playback-settings-fieldset">
            <input
              id="page-duration-input"
              type="number"
              min="1"
              max="3600"
              value="3"
            >
            <p id="page-duration-error" hidden></p>
            <fieldset id="repeat-mode-fieldset">
              <label>
                <input type="radio" name="repeat-mode" value="finite" checked>
                指定整輪次數
              </label>
              <label>
                <input type="radio" name="repeat-mode" value="continuous">
                持續顯示
              </label>
              <p id="repeat-error" hidden></p>
            </fieldset>
            <div id="round-count-field">
              <input
                id="round-count-input"
                type="number"
                min="1"
                max="999"
                value="1"
              >
              <p id="round-count-error" hidden></p>
            </div>
          </fieldset>

          <fieldset id="logo-settings-fieldset">
            <input id="logo-enabled-input" type="checkbox">
            <input id="logo-path-input" type="text">
            <p id="logo-path-error" hidden></p>
            <label for="logo-size-percent-input">Logo 大小（%）</label>
            <input
              id="logo-size-percent-input"
              type="number"
              min="50"
              max="1000"
              step="5"
              value="100"
            >
            <p id="logo-size-percent-error" hidden></p>
            <button id="choose-logo-button" type="button">選擇 Logo</button>
            <button id="remove-logo-button" type="button">移除 Logo</button>
            <select id="standby-background-mode-select">
              <option value="fixed">固定圖片</option>
              <option value="slideshow">多張輪播</option>
            </select>
            <input id="standby-background-summary" type="text" readonly>
            <p id="standby-background-error" hidden></p>
            <div id="standby-slide-duration-field" hidden>
              <input
                id="standby-slide-duration-input"
                type="number"
                min="1"
                max="3600"
                value="10"
              >
              <p id="standby-slide-duration-error" hidden></p>
            </div>
            <button id="choose-standby-background-button" type="button">
              選擇待機背景圖片
            </button>
            <button id="remove-standby-background-button" type="button">
              移除待機背景圖片
            </button>
          </fieldset>

          <fieldset id="appearance-settings-fieldset">
            <div id="background-color-field" hidden>
              <input id="background-color-picker" type="color" value="#000000">
              <input id="background-color-input" type="text" value="#000000">
              <p id="background-color-error" hidden></p>
            </div>
            <select id="message-background-preset-select">
              <option value="obsidian">黑曜石</option>
              <option value="walnut">煙燻胡桃木</option>
            </select>
            <p id="message-background-preset-error" hidden></p>
            <select id="font-family-select">
              <option value="Arial, sans-serif">Arial</option>
            </select>
            <p id="font-family-error" hidden></p>
            <input id="font-color-picker" type="color" value="#ffffff">
            <input id="font-color-input" type="text" value="#FFFFFF">
            <p id="font-color-error" hidden></p>
            <input id="font-size-percent-input" type="number" value="100">
            <p id="font-size-percent-error" hidden></p>
            <input
              id="standby-clock-size-percent-input"
              type="number"
              value="100"
            >
            <p id="standby-clock-size-percent-error" hidden></p>
            <input id="line-spacing-percent-input" type="number" value="100">
            <p id="line-spacing-percent-error" hidden></p>
            <input id="minimum-font-size-input" type="number" value="3">
            <p id="minimum-font-size-error" hidden></p>
            <input
              id="message-liquid-effect-enabled-input"
              type="checkbox"
              checked
            >
            <input
              id="standby-sand-effect-enabled-input"
              type="checkbox"
              checked
            >
            <p id="standby-sand-effect-error" hidden></p>
            <input
              id="inspection-background-color-picker"
              type="color"
              value="#000000"
            >
            <input
              id="inspection-background-color-input"
              type="text"
              value="#000000"
            >
            <p id="inspection-background-color-error" hidden></p>
            <input
              id="release-background-color-picker"
              type="color"
              value="#000000"
            >
            <input
              id="release-background-color-input"
              type="text"
              value="#000000"
            >
            <p id="release-background-color-error" hidden></p>
          </fieldset>

          <fieldset id="behavior-settings-fieldset">
            <select id="control-display-select">
              <option value="auto">自動（Windows 主螢幕）</option>
            </select>
            <select id="default-display-select">
              <option value="auto">自動（外接螢幕優先）</option>
            </select>
            <p id="display-assignment-error" hidden></p>
            <input id="date-time-enabled-input" type="checkbox">
            <input
              id="clock-time-input"
              type="text"
              inputmode="numeric"
              maxlength="8"
              autocomplete="off"
              spellcheck="false"
            >
            <p id="clock-time-error" hidden></p>
            <select id="render-resolution-select">
              <option value="auto">自動（建議）</option>
              <option value="1366x768">1366×768</option>
              <option value="1600x900">1600×900</option>
              <option value="1920x1080">1920×1080</option>
              <option value="2560x1440">2560×1440</option>
              <option value="3840x2160">3840×2160（4K）</option>
            </select>
            <p id="render-resolution-error" hidden></p>
            <input id="marquee-enabled-input" type="checkbox">
          </fieldset>

        </div>

        <button id="load-defaults-button" type="button">載入預設值</button>
        <button id="settings-close-button" type="button">關閉</button>
        <button id="save-settings-button" type="button">儲存設定</button>
      </form>
    </dialog>

    <script type="module">
      import { createSettingsView } from '../../../control/settings-view.mjs';

      const config = Object.freeze({
        configVersion: 11,
        logo: Object.freeze({
          enabled: false,
          path: null,
          sizePercent: 100,
        }),
        standby: Object.freeze({
          backgroundMode: 'fixed',
          backgroundImagePaths: Object.freeze([]),
          slideDurationSeconds: 10,
          sandEffectEnabled: true,
        }),
        appearance: Object.freeze({
          backgroundColor: '#000000',
          messageBackgroundPreset: 'obsidian',
          fontFamily: 'Arial, sans-serif',
          fontColor: '#FFFFFF',
          minimumFontSizeRem: 3,
          fontSizePercent: 100,
          standbyClockSizePercent: 100,
          lineSpacingPercent: 100,
          messageLiquidEffectEnabled: true,
        }),
        dateTime: Object.freeze({ enabled: false, offsetSeconds: 0 }),
        emergency: Object.freeze({
          inspectionBackgroundColor: '#000000',
          releaseBackgroundColor: '#000000',
        }),
        marquee: Object.freeze({ enabled: true }),
        playback: Object.freeze({
          pageDurationSeconds: 3,
          repeatMode: 'finite',
          roundCount: 1,
        }),
        display: Object.freeze({
          selectionMode: 'auto',
          controlDisplayId: null,
          defaultDisplayId: null,
          fullscreen: true,
          renderResolution: 'auto',
        }),
      });
      const snapshot = Object.freeze({
        revision: 1,
        config,
        defaults: config,
        notice: null,
      });
      const dialog = document.getElementById('settings-dialog');
      const standardTrigger = document.getElementById('open-settings-button');
      const nextAction = document.getElementById('next-action-input');

      // 模擬瀏覽器在 close() 返回前，先把焦點放到其他控制項。
      // Settings View 必須同步校正回唯一的齒輪入口。
      const nativeClose = dialog.close.bind(dialog);
      dialog.close = (...args) => {
        nativeClose(...args);
        nextAction.focus();
      };

      const view = createSettingsView({ document });
      view.renderOutputTopology({
        displays: [{
          id: 1,
          label: '管理螢幕',
          width: 1920,
          height: 1080,
          isPrimary: true,
        }, {
          id: 2,
          label: 'HDMI 電視',
          width: 3840,
          height: 2160,
          isPrimary: false,
        }],
      });
      view.connectController({
        async loadSettings() {
          view.renderSettingsSnapshot(snapshot);
        },
        async chooseLogo() {},
        async chooseStandbyBackground() {},
        async saveSettings() {
          return false;
        },
      });
      view.bind();

      async function openAndCloseSettings({
        scenario = '未命名情境',
        dirtyPlayback = false,
        dirtyAssignment = false,
        toggleMessageEffect = false,
        toggleStandbyEffect = false,
      } = {}) {
        const closeSettled = new Promise((resolve) => {
          dialog.addEventListener(
            'close',
            () => setTimeout(resolve, 0),
            { once: true },
          );
        });
        standardTrigger.click();
        await new Promise((resolve) => setTimeout(resolve, 0));

        if (!dialog.open) {
          throw new Error(
            `設定對話框未開啟：${scenario}；` +
            `入口 disabled=${standardTrigger.disabled}；` +
            `狀態=${document.getElementById('settings-status').textContent}。`,
          );
        }

        const pageDuration = document.getElementById('page-duration-input');
        const repeatFinite = document.querySelector(
          'input[name="repeat-mode"][value="finite"]',
        );
        const repeatContinuous = document.querySelector(
          'input[name="repeat-mode"][value="continuous"]',
        );
        const roundCount = document.getElementById('round-count-input');
        const logoSize = document.getElementById('logo-size-percent-input');
        const messageBackground = document.getElementById(
          'message-background-preset-select',
        );
        const standbyClockSize = document.getElementById(
          'standby-clock-size-percent-input',
        );
        const messageLiquidEffect = document.getElementById(
          'message-liquid-effect-enabled-input',
        );
        const standbySandEffect = document.getElementById(
          'standby-sand-effect-enabled-input',
        );
        const controlDisplay = document.getElementById(
          'control-display-select',
        );
        const defaultDisplay = document.getElementById(
          'default-display-select',
        );
        const dirtyStatus = document.getElementById('settings-dirty-status');
        const closeButton = document.getElementById('settings-close-button');
        const saveButton = document.getElementById('save-settings-button');
        const connectedDisplayOptions = [...defaultDisplay.options].map(
          ({ value, textContent }) => ({ value, textContent }),
        );

        if (dirtyPlayback) {
          logoSize.value = '150';
          logoSize.dispatchEvent(new Event('input', { bubbles: true }));
          messageBackground.value = 'walnut';
          messageBackground.dispatchEvent(new Event('change', {
            bubbles: true,
          }));
          standbyClockSize.value = '150';
          standbyClockSize.dispatchEvent(new Event('input', { bubbles: true }));
          pageDuration.value = '4';
          pageDuration.dispatchEvent(new Event('input', { bubbles: true }));
          roundCount.value = '2';
          roundCount.dispatchEvent(new Event('input', { bubbles: true }));
          repeatContinuous.checked = true;
          repeatContinuous.dispatchEvent(new Event('change', { bubbles: true }));
        }

        if (toggleMessageEffect) {
          messageLiquidEffect.checked = false;
          messageLiquidEffect.dispatchEvent(new Event('change', {
            bubbles: true,
          }));
        }

        if (toggleStandbyEffect) {
          standbySandEffect.checked = false;
          standbySandEffect.dispatchEvent(new Event('change', {
            bubbles: true,
          }));
        }

        if (dirtyAssignment) {
          controlDisplay.value = '1';
          controlDisplay.dispatchEvent(new Event('change', { bubbles: true }));
          defaultDisplay.value = '2';
          defaultDisplay.dispatchEvent(new Event('change', { bubbles: true }));
          view.renderOutputTopology({
            displays: [{
              id: 1,
              label: '管理螢幕',
              width: 1920,
              height: 1080,
              isPrimary: true,
            }],
          });
        }

        const beforeClose = {
          dirtyStatus: dirtyStatus.textContent,
          closeButtonText: closeButton.textContent,
          saveDisabled: saveButton.disabled,
          messageLiquidEffectEnabled: messageLiquidEffect.checked,
          standbySandEffectEnabled: standbySandEffect.checked,
          controlDisplayId: controlDisplay.value,
          defaultDisplayId: defaultDisplay.value,
          connectedDisplayOptions,
          controlOptions: [...controlDisplay.options].map(
            ({ value, textContent }) => ({ value, textContent }),
          ),
          displayOptions: [...defaultDisplay.options].map(
            ({ value, textContent }) => ({ value, textContent }),
          ),
        };

        document.getElementById('settings-close-button').click();
        const restoredFocusId = document.activeElement?.id ?? null;
        // close 事件可能稍後才送達；這段期間下一個操作已可取得焦點。
        nextAction.focus();
        await closeSettled;
        return {
          restoredFocusId,
          preservedNewFocusId: document.activeElement?.id ?? null,
          beforeClose,
          afterClose: {
            dirtyStatus: dirtyStatus.textContent,
            closeButtonText: closeButton.textContent,
            saveDisabled: saveButton.disabled,
            pageDuration: pageDuration.value,
            finiteChecked: repeatFinite.checked,
            continuousChecked: repeatContinuous.checked,
            roundCount: roundCount.value,
            logoSizePercent: logoSize.value,
            messageBackgroundPreset: messageBackground.value,
            standbyClockSizePercent: standbyClockSize.value,
            messageLiquidEffectEnabled: messageLiquidEffect.checked,
            standbySandEffectEnabled: standbySandEffect.checked,
            controlDisplayId: controlDisplay.value,
            defaultDisplayId: defaultDisplay.value,
          },
        };
      }

      window.runFocusRegression = async () => {
        standardTrigger.focus();
        const clean = await openAndCloseSettings({ scenario: 'baseline' });
        standardTrigger.focus();
        const messageEffect = await openAndCloseSettings({
          scenario: '訊息特效',
          toggleMessageEffect: true,
        });
        standardTrigger.focus();
        const standbyEffect = await openAndCloseSettings({
          scenario: '待機風吹沙特效',
          toggleStandbyEffect: true,
        });
        standardTrigger.focus();
        const dirty = await openAndCloseSettings({
          scenario: '兩項特效與其他設定',
          dirtyPlayback: true,
          dirtyAssignment: true,
          toggleMessageEffect: true,
          toggleStandbyEffect: true,
        });
        return { clean, messageEffect, standbyEffect, dirty };
      };
    </script>
  </body>
</html>
